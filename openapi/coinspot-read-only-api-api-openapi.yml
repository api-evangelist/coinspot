components:
  responses:
    Error:
      description: Any non-200 status indicates failure; a message value describes the issue.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
              message:
                type: string
          example:
            status: error
            message: Coin not found
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: key
      description: Your API key generated from the settings page (https://www.coinspot.com.au/my/api).
    sign:
      type: apiKey
      in: header
      name: sign
      description: The POST data signed using your secret key according to HMAC-SHA512.
