              example:
                status: ok
                message: ok
                balances:
                - AUD:
                    balance: 1000.11
                    audbalance: 1000.11
                    rate: 1
                - BTC:
                    balance: 1.1111111
                    audbalance: 2222.22
                    rate: 111111.11
                - LTC:
