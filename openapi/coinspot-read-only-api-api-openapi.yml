openapi: 3.2.0
info:
  title: CoinSpot API V2 Read Only API
  version: 2 (BETA)
  description: 'CoinSpot API V2 (BETA): Public API (GET, unauthenticated), the full-access API and the Read Only API (POST, signed with HMAC-SHA512). GENERATED BY API EVANGELIST FROM THE PROVIDER DOCUMENTATION PAGE https://www.coinspot.com.au/v2/api on 2026-10-13 -- CoinSpot publishes no machine-readable contract. Paths, inputs and response fields are transcribed from that page; field types are not documented there and are left as strings except nonce.'
  contact:
    name: CoinSpot
    url: https://www.coinspot.com.au/contact
  termsOfService: https://www.coinspot.com.au/terms
  x-generated-from: documentation
  x-generated-by: api-evangelist
  x-source-url: https://www.coinspot.com.au/v2/api
  x-generated: '2026-10-13'
servers:
- url: https://www.coinspot.com.au/api/v2
  description: API (full access) and Read Only API (/ro) root
security:
- apiKey: []
  sign: []
tags:
- name: Read Only API
paths:
  /ro/status:
    post:
      operationId: roReadOnlyStatusCheck
      summary: Read Only Status Check
      tags:
      - Read Only API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok
              example:
                status: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /ro/orders/market/open:
    post:
      operationId: roOpenMarketOrders
      summary: Open Market Orders
      tags:
      - Read Only API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 20 open buy order rates for the given coin
                  sellorders:
                    description: list of top 20 open sell order rates for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.0001
                  rate: 111111
                  total: 0.1
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.001
                  rate: 11111111
                  total: 0.01
                  coin: BTC
                  market: BTC/AUD
                sellorders:
                - amount: 0.0001
                  rate: 111111
                  total: 1
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.0011855
                  rate: 11111
                  total: 2
                  coin: BTC
                  market: BTC/AUD
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                markettype:
                  type: string
                  description: (optional, available markets only) market coin short name, example values 'AUD', 'USDT'
  /ro/orders/market/completed:
    post:
      operationId: roCompletedMarketOrders
      summary: Completed Market Orders
      tags:
      - Read Only API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 100 completed buy orders for the given coin
                  sellorders:
                    description: list of top 100 completed sell orders for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.0001
                  rate: 111111
                  total: 0.1
                  coin: BTC
                  market: BTC/AUD
                  solddate: '2020-05-21T13:22:45.000Z'
                  audfeeExGst: 0.123
                  audGst: 0.0123
                  audtotal: 100.0
                - amount: 0.001
                  rate: 11111111
                  total: 0.01
                  coin: BTC
                  market: BTC/USDT
                  solddate: '2020-05-21T13:22:45.000Z'
                  audfeeExGst: 0.123
                  audGst: 0.0123
                  audtotal: 100.0
                sellorders:
                - amount: 0.0001
                  rate: 111111
                  total: 1
                  coin: BTC
                  market: BTC/AUD
                  solddate: '2020-05-21T13:22:45.000Z'
                  audfeeExGst: 0.123
                  audGst: 0.0123
                  audtotal: 100.0
