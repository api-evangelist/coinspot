                  rate: 11111
                  total: 2
                  coin: BTC
                  market: BTC/USDT
                  solddate: '2020-05-21T13:22:45.000Z'
                  audfeeExGst: 0.123
                  audGst: 0.0123
                  audtotal: 100.0
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                markettype:
                  type: string
                  description: (optional, available markets only) market coin short name, example values 'AUD', 'USDT'
                startdate:
                  type: string
                  description: '(optional, note: date is UTC date or UNIX EPOCH time) format ''YYYY-MM-DD'' or e.g. 1614824116'
                enddate:
                  type: string
                  description: '(optional, note: date is UTC date or UNIX EPOCH time) format ''YYYY-MM-DD'' or e.g. 1614824116'
                limit:
                  type: string
                  description: (optional, default is 200 records, max is 500 records)
