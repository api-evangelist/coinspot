  /ro/my/balance/{cointype}:
    post:
      operationId: roMyCoinBalanceAvailable
      summary: My Coin Balance (Available)
      tags:
      - Read Only API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  balance:
                    description: 'object containing property with your actual/available balance, AUD value (actual balance) and rate for that coin (note: available balance will be included in response if available option is set to ''yes'')'
              example:
                status: ok
                message: ok
                balance:
                  EOS:
                    balance: 1.11111
                    available: 0.99999
                    audbalance: 222.22
                    rate: 1.11111
        default:
          $ref: '#/components/responses/Error'
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'AUD', 'BTC', 'LTC', 'DOGE'
      - name: available
        in: query
        required: false
        schema:
          type: string
          enum:
          - 'yes'
          - 'no'
        description: '''yes'' or ''no'', yes to return available balance in addition to actual balance'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
