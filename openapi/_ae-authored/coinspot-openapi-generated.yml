          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 20 open buy order rates for the given coin / market
                  sellorders:
                    description: list of top 20 open sell order rates for the given coin / market
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  market: BTC/USDT
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  market: BTC/USDT
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  market: BTC/USDT
                - amount: 0.0002
                  rate: 111111
                  total: 2.1111
                  coin: BTC
                  market: BTC/USDT
        default:
