                    description: market coin is trading in
              example:
                status: ok
                message: ok
                rate: 11111
                market: BTC/USDT
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market you wish to use to buy it, example value: ''USDT'' (only for available markets)'
  /sellprice/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestSellPrice
      summary: Latest Sell Price
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: latest sell price for that coin
                  market:
                    description: market coin is trading in
              example:
                status: ok
                message: ok
                rate: 11111
                market: BTC/AUD
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
  /sellprice/{cointype}/{markettype}:
