        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: market coin short name, example value 'USDT' (only for available markets)
  /buyprice/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestBuyPrice
      summary: Latest Buy Price
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: latest buy price for that coin
                  market:
                    description: market coin is trading in
              example:
                status: ok
                message: ok
                rate: 11111
                market: BTC/AUD
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
  /buyprice/{cointype}/{markettype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestBuyPriceMarket
      summary: Latest Buy Price / Market
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
