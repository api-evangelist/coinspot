                  sellorders:
                    description: list of top 100 completed AUD sell orders for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                - amount: 0.0002
