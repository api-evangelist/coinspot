                  coinlist:
                    description: list of buy now coin tickers available for buy now transactions
              example:
                status: ok
                message: ok
                coinlist:
                - BTC
                - LTC
                - XRP
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
