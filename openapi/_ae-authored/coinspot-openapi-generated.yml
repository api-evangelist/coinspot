                    description: ok, description of error if error occurred
                  orders:
                    description: list of top 100 completed orders for the given coin / market - not separated into buy/sell
                      orders
              example:
                status: ok
                message: ok
                orders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/USDT
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/USDT
        default:
