                - LTC
                - XRP
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /quote/buy/now:
    post:
      operationId: buyNowQuote
      summary: Buy Now Quote
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: rate per specified coin
              example:
                status: ok
                message: ok
                rate: 1111
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amount
              - amounttype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount to buy
                amounttype:
                  type: string
                  description: '''coin'' or ''aud'' - whether the amount above is coin amount or AUD amount'
  /quote/sell/now:
    post:
      operationId: sellNowQuote
      summary: Sell Now Quote
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: rate per specified coin inclusive of fee
              example:
                status: ok
                message: ok
                rate: 11111
        default:
