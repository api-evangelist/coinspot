openapi: 3.1.0
info:
  title: CoinSpot API V2
  version: 2 (BETA)
  description: 'CoinSpot API V2 (BETA): Public API (GET, unauthenticated), the full-access API and the Read Only API (POST,
    signed with HMAC-SHA512). GENERATED BY API EVANGELIST FROM THE PROVIDER DOCUMENTATION PAGE https://www.coinspot.com.au/v2/api
    on 2026-10-13 -- CoinSpot publishes no machine-readable contract. Paths, inputs and response fields are transcribed from
    that page; field types are not documented there and are left as strings except nonce.'
  contact:
    name: CoinSpot
    url: https://www.coinspot.com.au/contact
  termsOfService: https://www.coinspot.com.au/terms
  x-generated-from: documentation
  x-generated-by: api-evangelist
  x-source-url: https://www.coinspot.com.au/v2/api
  x-generated: '2026-10-13'
servers:
- url: https://www.coinspot.com.au/api/v2
  description: API (full access) and Read Only API (/ro) root
tags:
- name: Public API
- name: Trading API
- name: Read Only API
security:
- apiKey: []
  sign: []
paths:
  /latest:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestPrices
      summary: Latest Prices
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  prices:
                    description: array of objects with one set of properties for each coin with latest buy and sell prices,
                      non aud markets are symbolised by (e.g.) 'btc_usdt'
              example:
                status: ok
                message: ok
                prices:
                  btc:
                    bid: 11111
                    ask: 222222
                    last: 1111.11
                  btc_usdt:
                    bid: 11111
                    ask: 222222
                    last: 1111.11
                  ltc:
                    bid: 1.11111
                    ask: 111
                    last: 111
                  doge:
                    bid: 1.111111
                    ask: 1.111111
                    last: 1.11111
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters: []
  /latest/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestCoinPrices
      summary: Latest Coin Prices
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  prices:
                    description: object with set of properties for coin with latest buy, ask and last prices
              example:
                status: ok
                message: ok
                prices:
                  bid: 11111
                  ask: 222222
                  last: 1111.11
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
  /latest/{cointype}/{markettype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: latestCoinMarketPrices
      summary: Latest Coin / Market Prices
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  prices:
                    description: object with set of properties for coin with latest buy, ask and last prices
