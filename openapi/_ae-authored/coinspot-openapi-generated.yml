                rate: 11111
                market: BTC/USDT
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
