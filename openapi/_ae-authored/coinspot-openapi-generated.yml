      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market, example values ''USDT'' (note: only for available markets)'
  /orders/completed/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: completedOrdersByCoin
