      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market, example values ''USDT'' (note: only for available markets)'
  /status:
    post:
      operationId: fullAccessStatusCheck
      summary: Full Access Status Check
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok
              example:
                status: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /my/coin/deposit:
    post:
      operationId: myCoinDepositAddress
      summary: My Coin Deposit Address
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  networks:
                    description: list of available networks (fields below)
                  name:
                    description: network name
                  network:
                    description: network type
                  address:
                    description: your deposit address for the coin
                  memo:
                    description: your memo / tag for the coin (where required)
              example:
                status: ok
                message: ok
                networks:
                - name: BEP2
                  network: BNB
                  address: bnbabcdef123456abcdef123456
                  memo: '123456'
                - name: ERC20
                  network: ETH
                  address: '0xabcdef123456abcdef123456'
                  memo: ''
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
  /my/buy/now/coinlist:
