        description: 'coin market you wish to sell it for, example value: ''USDT'' (note: only for available markets)'
  /orders/open/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: openOrdersByCoin
      summary: Open Orders By Coin
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 100 open AUD buy orders for the given coin
                  sellorders:
                    description: list of top 100 open AUD sell orders for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  market: BTC/AUD
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.0002
                  rate: 111111
                  total: 2.1111
                  coin: BTC
                  market: BTC/AUD
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: the coin short name, example value 'BTC', 'LTC', 'DOGE'
  /orders/open/{cointype}/{markettype}:
