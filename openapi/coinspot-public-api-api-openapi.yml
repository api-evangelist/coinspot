          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market, example values ''USDT'' (note: only for available markets)'
  /orders/summary/completed/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: completedOrdersByCoinSummaryOnly
      summary: Completed Orders By Coin (Summary Only)
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  orders:
                    description: list of top 100 completed AUD orders for the given coin - not separated into buy/sell orders
              example:
                status: ok
                message: ok
                orders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
