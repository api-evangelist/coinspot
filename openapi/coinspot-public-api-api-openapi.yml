                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/USDT
                - amount: 0.1
                  rate: 1111112
                  total: 111111
