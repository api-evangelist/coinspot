                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: latest sell price for that coin
                  market:
                    description: market coin is trading in
              example:
                status: ok
                message: ok
                rate: 11111
                market: BTC/USDT
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market you wish to sell it for, example value: ''USDT'' (note: only for available markets)'
  /orders/open/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: openOrdersByCoin
      summary: Open Orders By Coin
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 100 open AUD buy orders for the given coin
                  sellorders:
                    description: list of top 100 open AUD sell orders for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  market: BTC/AUD
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  market: BTC/AUD
                - amount: 0.0002
                  rate: 111111
                  total: 2.1111
                  coin: BTC
                  market: BTC/AUD
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: the coin short name, example value 'BTC', 'LTC', 'DOGE'
  /orders/open/{cointype}/{markettype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: openOrdersByCoinMarket
      summary: Open Orders By Coin / Market
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 20 open buy order rates for the given coin / market
                  sellorders:
                    description: list of top 20 open sell order rates for the given coin / market
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  market: BTC/USDT
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  market: BTC/USDT
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  market: BTC/USDT
                - amount: 0.0002
                  rate: 111111
                  total: 2.1111
                  coin: BTC
                  market: BTC/USDT
        default:
          $ref: '#/components/responses/Error'
      security: []
      parameters:
      - name: cointype
        in: path
        required: true
        schema:
          type: string
        description: coin short name, example value 'BTC', 'LTC', 'DOGE'
      - name: markettype
        in: path
        required: true
        schema:
          type: string
        description: 'coin market, example values ''USDT'' (note: only for available markets)'
  /orders/completed/{cointype}:
    servers:
    - url: https://www.coinspot.com.au/pubapi/v2
    get:
      operationId: completedOrdersByCoin
      summary: Completed Orders By Coin
      tags:
      - Public API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  buyorders:
                    description: list of top 100 completed AUD buy orders for the given coin
                  sellorders:
                    description: list of top 100 completed AUD sell orders for the given coin
              example:
                status: ok
                message: ok
                buyorders:
                - amount: 0.1
                  rate: 111111
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                - amount: 0.1
                  rate: 1111112
                  total: 111111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                sellorders:
                - amount: 0.0001
                  rate: 1111111
                  total: 1.111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
                - amount: 0.0002
                  rate: 111111
                  total: 2.1111
                  coin: BTC
                  solddate: '2020-05-21T13:22:45.000Z'
                  market: BTC/AUD
