openapi: 3.2.0
info:
  title: CoinSpot API V2 Trading API
  version: 2 (BETA)
  description: 'CoinSpot API V2 (BETA): Public API (GET, unauthenticated), the full-access API and the Read Only API (POST, signed with HMAC-SHA512). GENERATED BY API EVANGELIST FROM THE PROVIDER DOCUMENTATION PAGE https://www.coinspot.com.au/v2/api on 2026-10-13 -- CoinSpot publishes no machine-readable contract. Paths, inputs and response fields are transcribed from that page; field types are not documented there and are left as strings except nonce.'
  contact:
    name: CoinSpot
    url: https://www.coinspot.com.au/contact
  termsOfService: https://www.coinspot.com.au/terms
  x-generated-from: documentation
  x-generated-by: api-evangelist
  x-source-url: https://www.coinspot.com.au/v2/api
  x-generated: '2026-10-13'
servers:
- url: https://www.coinspot.com.au/api/v2
  description: API (full access) and Read Only API (/ro) root
security:
- apiKey: []
  sign: []
tags:
- name: Trading API
paths:
  /status:
    post:
      operationId: fullAccessStatusCheck
      summary: Full Access Status Check
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok
              example:
                status: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /my/coin/deposit:
    post:
      operationId: myCoinDepositAddress
      summary: My Coin Deposit Address
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  networks:
                    description: list of available networks (fields below)
                  name:
                    description: network name
                  network:
                    description: network type
                  address:
                    description: your deposit address for the coin
                  memo:
                    description: your memo / tag for the coin (where required)
              example:
                status: ok
                message: ok
                networks:
                - name: BEP2
                  network: BNB
                  address: bnbabcdef123456abcdef123456
                  memo: '123456'
                - name: ERC20
                  network: ETH
                  address: '0xabcdef123456abcdef123456'
                  memo: ''
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
  /my/buy/now/coinlist:
    post:
      operationId: buyNowCoinList
      summary: Buy Now Coin List
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coinlist:
                    description: list of buy now coin tickers available for buy now transactions
              example:
                status: ok
                message: ok
                coinlist:
                - BTC
                - LTC
                - XRP
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /my/sell/now/coinlist:
    post:
      operationId: sellswapNowCoinList
      summary: Sell/Swap Now Coin List
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coinlist:
                    description: list of sell now coin tickers available for sell now transactions
              example:
                status: ok
                message: ok
                coinlist:
                - BTC
                - LTC
                - XRP
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
  /quote/buy/now:
    post:
      operationId: buyNowQuote
      summary: Buy Now Quote
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: rate per specified coin
              example:
                status: ok
                message: ok
                rate: 1111
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amount
              - amounttype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount to buy
                amounttype:
                  type: string
                  description: '''coin'' or ''aud'' - whether the amount above is coin amount or AUD amount'
  /quote/sell/now:
    post:
      operationId: sellNowQuote
      summary: Sell Now Quote
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: rate per specified coin inclusive of fee
              example:
                status: ok
                message: ok
                rate: 11111
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amount
              - amounttype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount of coins to sell
                amounttype:
                  type: string
                  description: '''coin'' or ''aud'' - whether the amount below is coin amount or AUD amount'
  /quote/swap/now:
    post:
      operationId: swapNowQuote
      summary: Swap Now Quote
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  rate:
                    description: rate per coin swapped exclusive of fee
              example:
                status: ok
                message: ok
                rate: 11111
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointypesell
              - cointypebuy
              - amount
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointypesell:
                  type: string
                  description: coin short name you would like to swap, example value 'BTC', 'LTC', 'DOGE'
                cointypebuy:
                  type: string
                  description: coin short name you would like to swap it for, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount of coins to swap
  /my/buy:
    post:
      operationId: placeMarketBuyOrder
      summary: Place Market Buy Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  market:
                    description: market used to place buy order for the coin
                  amount:
                    description: coin amount that was placed
                  rate:
                    description: rate that order was placed at
                  id:
                    description: id of buy order created which can be used to cancel the order if desired
              example:
                status: ok
                message: ok
                coin: BTC
                market: BTC/AUD
                amount: 1.234
                rate: 123.344
                id: '12345678901234567890'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amount
              - rate
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount of coins you want to buy, max precision 8 decimal places
                rate:
                  type: string
                  description: rate in market currency (e.g. AUD or USDT) you are willing to pay, max precision 8 decimal places
                markettype:
                  type: string
                  description: (optional, available markets only, default 'AUD') market coin short name to use to buy the coin, example value 'USDT'
  /my/buy/edit:
    post:
      operationId: editOpenMarketBuyOrder
      summary: Edit Open Market Buy Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred (on success)
                  updated:
                    description: 'true'
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  rate:
                    description: new rate that order has been placed at
                  newrate:
                    description: requested rate
                  amount:
                    description: coin amount calculated as a result of the rate adjustment
                  total:
                    description: total is not adjusted from original order
                  id:
                    description: id of the edited buy order (unchanged)
              example:
                status: ok
                message: ok
                id: '12345678901234567890'
                coin: BTC
                rate: '1234556'
                newrate: '1234556'
                amount: 1.234
                total: 1234
                updated: true
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - id
              - rate
              - newrate
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                id:
                  type: string
                  description: order id of the target buy order
                rate:
                  type: string
                  description: current rate in market currency (e.g. AUD or USDT) of the open order, max precision 8 decimal places
                newrate:
                  type: string
                  description: proposed rate in market currency (e.g. AUD or USDT) to edit the open order, max precision 8 decimal places
  /my/buy/now:
    post:
      operationId: placeBuyNowOrder
      summary: Place Buy Now Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  market:
                    description: market used to place buy order for the coin
                  amount:
                    description: amount that was bought
                  total:
                    description: total amount in market currency
              example:
                status: ok
                message: ok
                coin: BTC
                amount: 1.234
                market: BTC/AUD
                total: 10.234
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amounttype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amounttype:
                  type: string
                  description: '''coin'' or ''aud'' - whether the amount below is coin amount or AUD amount'
                amount:
                  type: string
                  description: 'amount to buy, max precision for coin is 8 decimal places and 2 decimal places for AUD Optional Note 1: if rate option below is submitted a threshold value must also be submitted Note 2: buy will occur at current rate not submitted rate'
                rate:
                  type: string
                  description: (optional) rate in AUD received from using Buy Now Quote or otherwise
                threshold:
                  type: string
                  description: (optional) 0 to 1000 - buy request will terminate if not within percentage threshold for current rate to vary from submitted rate, max precision for percentage is 8 decimal places
                direction:
                  type: string
                  description: (optional) UP, DOWN, or BOTH (default is UP) - direction the price has moved for the percentage threshold to apply
  /my/sell:
    post:
      operationId: placeMarketSellOrder
      summary: Place Market Sell Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coin:
                    description: coin short name
                  market:
                    description: market used to place sell order for the coin
                  amount:
                    description: coin amount that was placed in order
                  rate:
                    description: rate that order was placed at
                  id:
                    description: id of sell order created which can be used to cancel the order if desired
              example:
                status: ok
                message: ok
                coin: BTC
                market: BTC/AUD
                amount: 1.234
                rate: 123.344
                id: '12345678901234567890'
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amount
              - rate
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: amount of coins you want to sell, max precision 8 decimal places
                rate:
                  type: string
                  description: rate in AUD you are willing to sell for, max precision 8 decimal places
                markettype:
                  type: string
                  description: (optional, available markets only, default 'AUD') market coin short name to use to sell the coin into, example value 'USDT'
  /my/sell/edit:
    post:
      operationId: editOpenMarketSellOrder
      summary: Edit Open Market Sell Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred (on success)
                  updated:
                    description: 'true'
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  rate:
                    description: new rate that order has been placed at
                  newrate:
                    description: requested rate
                  amount:
                    description: amount is not adjusted from original order
                  total:
                    description: total calculated as a result of the rate adjustment
                  id:
                    description: id of the edited sell order (unchanged)
              example:
                status: ok
                message: ok
                id: '12345678901234567890'
                coin: BTC
                rate: '1234556'
                newrate: '1234556'
                amount: 1234
                total: 1.234
                updated: true
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - id
              - rate
              - newrate
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                id:
                  type: string
                  description: order id of the target sell order
                rate:
                  type: string
                  description: current rate in market currency (e.g. AUD or USDT) of the open order, max precision 8 decimal places
                newrate:
                  type: string
                  description: proposed rate in market currency (e.g. AUD or USDT) to edit the open order, max precision 8 decimal places
  /my/sell/now:
    post:
      operationId: placeSellNowOrder
      summary: Place Sell Now Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  market:
                    description: market used to place sell order for the coin
                  amount:
                    description: amount that was sold
                  rate:
                    description: rate that order was placed at
                  total:
                    description: total amount in market currency
              example:
                status: ok
                message: ok
                coin: BTC
                amount: 1.234
                rate: 3.234
                market: BTC/AUD
                total: 10.234
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - cointype
              - amounttype
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                cointype:
                  type: string
                  description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                amounttype:
                  type: string
                  description: '''coin'' or ''aud'' - whether the amount below is coin amount or AUD amount'
                amount:
                  type: string
                  description: 'amount of coins you want to sell, max precision 8 decimal places Optional Note 1: if rate option below is submitted a threshold value must also be submitted Note 2: sell will occur at current rate not submitted rate'
                rate:
                  type: string
                  description: (optional) rate in AUD received from using Sell Now Quote or otherwise
                threshold:
                  type: string
                  description: (optional) 0 to 1000 - sell request will terminate if not within percentage threshold for current rate to vary from submitted rate, max precision for percentage is 8 decimal places
                direction:
                  type: string
                  description: (optional) UP, DOWN, or BOTH (default is DOWN) - direction the price has moved for the percentage threshold to apply
  /my/swap/now:
    post:
      operationId: placeSwapNowOrder
      summary: Place Swap Now Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
                  coin:
                    description: coin short name, example value 'BTC', 'LTC', 'DOGE'
                  market:
                    description: coin swapped and coin it was swapped for
                  amount:
                    description: coin amount that was swapped
                  rate:
                    description: rate that order was placed at
                  total:
                    description: total amount in swapped coin currency
              example:
                status: ok
                message: ok
                coin: BTC
                amount: 1.234
                rate: 3.234
                market: BTC/ETH
                total: 10.234
        default:
          $ref: '#/components/responses/Error'
      requestBody:
