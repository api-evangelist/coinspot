                cointypesell:
                  type: string
                  description: coin short name you would like to swap, example value 'BTC', 'LTC', 'DOGE'
                cointypebuy:
                  type: string
                  description: coin short name you would like to swap it for, example value 'BTC', 'LTC', 'DOGE'
                amount:
                  type: string
                  description: 'amount of (cointypesell) to swap, max precision for coin is 8 decimal places Optional Note 1: if rate option below is submitted a threshold value must also be submitted Note 2: swap will occur at current rate not submitted rate'
                rate:
                  type: string
                  description: (optional) rate received from using Swap Now Quote or otherwise
                threshold:
                  type: string
                  description: (optional) 0 to 1000 - swap request will terminate if not within percentage threshold for current rate to vary from submitted rate, max precision for percentage is 8 decimal places
                direction:
                  type: string
                  description: (optional) UP, DOWN, or BOTH (default is BOTH) - direction the price has moved for the percentage threshold to apply
  /my/buy/cancel:
    post:
      operationId: cancelMyBuyOrder
      summary: Cancel My Buy Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
              example:
                status: ok
                message: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - id
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                id:
                  type: string
                  description: 'id of the buy order to cancel Note 1: ''ok'' response means attempt to cancel has been successfully lodged, the cancel request still may not succeed even though lodged if the buy process has already commenced Note 2: Too many cancellations of open buy orders may trigger rate limiting of future buys. If frequently changing rates please use the ''edit buy order'' function instead.'
  /my/buy/cancel/all:
    post:
      operationId: cancelMyBuyOrdersAll
      summary: Cancel My Buy Orders All
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
              example:
                status: ok
                message: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                coin:
                  type: string
                  description: '(optional) coin of the buy orders to cancel Note 1: ''ok'' response means attempt to cancel orders has been successfully lodged, the cancel requests still may not succeed even though lodged if the buy process has already commenced Note 2: Too many cancellations of open buy orders may trigger rate limiting of future buys. If frequently changing rates please use the ''edit buy order'' function instead.'
  /my/sell/cancel:
    post:
      operationId: cancelMySellOrder
      summary: Cancel My Sell Order
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    description: ok, error
                  message:
                    description: ok, description of error if error occurred
              example:
                status: ok
                message: ok
        default:
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - nonce
              - id
              properties:
                nonce:
                  type: integer
                  description: Any integer value which must always be greater than the previous requests nonce value.
                id:
                  type: string
                  description: 'id of the sell order to cancel Note 1: ''ok'' response means attempt to cancel has been successfully lodged, the cancel request still may not succeed even though lodged if the sell process has already commenced Note 2: Too many cancellations of open sell orders may trigger rate limiting of future sells. If frequently changing rates please use the ''edit sell order'' function instead.'
  /my/sell/cancel/all:
    post:
      operationId: cancelMySellOrdersAll
      summary: Cancel My Sell Orders All
      tags:
      - Trading API
      responses:
        '200':
          description: Successful response (status ok).
          content:
            application/json:
