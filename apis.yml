aid: coinspot
name: CoinSpot
image: https://www.coinspot.com.au/public/img/rocket-thumb.png
description: 'CoinSpot is an Australian cryptocurrency exchange (coinspot.com.au, member since 2014) offering buy/sell, swap, market and OTC trading across hundreds of coins. It publishes the CoinSpot API
  V2 (BETA): an unauthenticated Public API for latest prices and order books, a full-access trading API (quotes, market and instant orders, cancels, coin withdrawals) and a Read Only API for balances and
  history, all signed with HMAC-SHA512. The legacy V1 API remains active.'
